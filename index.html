<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1440"/>
<title>CHALK · Coach Workout Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* CHALK — Coach's strength platform
   Athletic, high-contrast, gym-floor energy.
   Type: Inter Tight (UI), Archivo Black (display), JetBrains Mono (numbers)
*/

:root {
  --bg: #0B0B0C;
  --bg-1: #131315;
  --bg-2: #1A1A1D;
  --bg-3: #232327;
  --line: #2A2A2F;
  --line-2: #36363C;
  --ink: #F5F4F0;
  --ink-2: #B5B3AB;
  --ink-3: #807E76;
  --ink-4: #54534D;
  --accent: #E8FF3A;        /* electric lime */
  --accent-ink: #0B0B0C;
  --accent-2: #FF6B2C;      /* warning orange */
  --good: #3AE07A;
  --warn: #FFB23A;
  --bad: #FF4D4D;
}

[data-theme="light"] {
  --bg: #F5F4F0;
  --bg-1: #ECEAE3;
  --bg-2: #E2DFD6;
  --bg-3: #D6D2C7;
  --line: #C8C3B5;
  --line-2: #B0AB9B;
  --ink: #15140F;
  --ink-2: #45433C;
  --ink-3: #6F6C61;
  --ink-4: #908C7F;
  --accent: #1E1E1E;
  --accent-ink: #E8FF3A;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter Tight', -apple-system, system-ui, sans-serif;
  font-size: 13.5px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

.font-display {
  font-family: 'Archivo Black', 'Inter Tight', sans-serif;
  font-weight: 900;
  letter-spacing: -0.01em;
  text-transform: uppercase;
}
.font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.tnum { font-variant-numeric: tabular-nums; }

/* ─── App shell ──────────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: 220px 1fr;
  height: 100vh;
  width: 100vw;
}

.sidebar {
  background: var(--bg-1);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 18px 14px;
  gap: 22px;
  overflow-y: auto;
}

.sb-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 6px 6px;
}
.sb-brand-mark {
  width: 28px; height: 28px;
  background: var(--accent);
  color: var(--accent-ink);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Archivo Black', sans-serif;
  font-size: 14px;
  border-radius: 4px;
  letter-spacing: -0.02em;
}
.sb-brand-name {
  font-family: 'Archivo Black', sans-serif;
  font-size: 18px;
  letter-spacing: 0.02em;
}
.sb-brand-sub { font-size: 9px; color: var(--ink-3); letter-spacing: 0.12em; text-transform: uppercase; }

.sb-section-label {
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-4);
  padding: 0 8px 6px;
  font-weight: 600;
}

.sb-nav { display: flex; flex-direction: column; gap: 1px; }
.sb-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border-radius: 6px;
  color: var(--ink-2);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  user-select: none;
  border: 0; background: transparent; text-align: left; width: 100%;
  font-family: inherit;
}
.sb-item:hover { background: var(--bg-2); color: var(--ink); }
.sb-item[data-active="true"] {
  background: var(--bg-3);
  color: var(--ink);
}
.sb-item-icon { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; opacity: 0.85; }
.sb-item-count { margin-left: auto; font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.sb-clients { display: flex; flex-direction: column; gap: 1px; max-height: 260px; overflow-y: auto; padding-right: 4px; }
.sb-client-row {
  display: flex; align-items: center; gap: 9px;
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12.5px;
  color: var(--ink-2);
  border: 0; background: transparent; text-align: left; width: 100%;
  font-family: inherit;
}
.sb-client-row:hover { background: var(--bg-2); color: var(--ink); }
.sb-client-row[data-active="true"] { background: var(--bg-3); color: var(--ink); }
.sb-client-avatar {
  width: 22px; height: 22px; border-radius: 4px;
  background: var(--bg-3);
  display: flex; align-items: center; justify-content: center;
  font-size: 9.5px; font-weight: 700;
  letter-spacing: -0.01em;
  flex-shrink: 0;
  color: var(--ink);
}
.sb-client-status {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ink-4);
  margin-left: auto;
  flex-shrink: 0;
}
.sb-client-status[data-state="active"] { background: var(--good); }
.sb-client-status[data-state="warn"] { background: var(--warn); }

.sb-coach {
  margin-top: auto;
  padding: 10px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 9px;
}
.sb-coach-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 11px;
  font-family: 'Archivo Black', sans-serif;
}
.sb-coach-name { font-size: 12.5px; font-weight: 600; }
.sb-coach-role { font-size: 10px; color: var(--ink-3); letter-spacing: 0.04em; }

/* ─── Main area ──────────────────────────────────────────────── */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

.topbar {
  height: 52px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 18px;
  gap: 14px;
  flex-shrink: 0;
  background: var(--bg);
}
.topbar-crumbs { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); }
.topbar-crumbs b { color: var(--ink); font-weight: 600; }
.topbar-crumbs-sep { color: var(--ink-4); }

.topbar-spacer { flex: 1; }

.topbar-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  color: var(--ink-3);
  width: 240px;
}

.topbar-presence {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--ink-3);
}
.presence-dots { display: flex; }
.presence-dots .sb-coach-avatar {
  width: 22px; height: 22px;
  border: 2px solid var(--bg);
  margin-left: -6px;
  font-size: 9px;
}
.presence-dots .sb-coach-avatar:first-child { margin-left: 0; }

.topbar-sync {
  display: flex; align-items: center; gap: 6px;
  font-size: 10.5px; color: var(--ink-3);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); }

.btn {
  appearance: none; border: 0;
  background: var(--accent); color: var(--accent-ink);
  font-family: inherit; font-weight: 700; font-size: 12px;
  letter-spacing: 0.02em; text-transform: uppercase;
  padding: 8px 14px; border-radius: 4px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { filter: brightness(1.05); }
.btn.btn-secondary { background: var(--bg-2); color: var(--ink); border: 1px solid var(--line); }
.btn.btn-secondary:hover { background: var(--bg-3); }
.btn.btn-ghost { background: transparent; color: var(--ink-2); padding: 6px 10px; }
.btn.btn-ghost:hover { background: var(--bg-2); color: var(--ink); }
.btn.btn-sm { padding: 5px 9px; font-size: 10.5px; }

.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}

/* ─── Generic ────────────────────────────────────────────────── */
.card {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}
.card-pad { padding: 16px 18px; }

.kicker {
  font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 600;
}

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 7px; border-radius: 3px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
  text-transform: uppercase;
  background: var(--bg-3); color: var(--ink-2);
}
.pill[data-tone="accent"] { background: var(--accent); color: var(--accent-ink); }
.pill[data-tone="good"] { background: rgba(58,224,122,.15); color: var(--good); }
.pill[data-tone="warn"] { background: rgba(255,178,58,.15); color: var(--warn); }
.pill[data-tone="bad"] { background: rgba(255,77,77,.15); color: var(--bad); }
.pill[data-tone="line"] { background: transparent; border: 1px solid var(--line-2); color: var(--ink-2); }

.divider { height: 1px; background: var(--line); width: 100%; }

/* Scrollbars (dark) */
.content::-webkit-scrollbar, .sb-clients::-webkit-scrollbar, .sidebar::-webkit-scrollbar { width: 10px; height: 10px; }
.content::-webkit-scrollbar-track, .sb-clients::-webkit-scrollbar-track, .sidebar::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb, .sb-clients::-webkit-scrollbar-thumb, .sidebar::-webkit-scrollbar-thumb {
  background: var(--bg-3);
  border: 2px solid var(--bg);
  border-radius: 5px;
}
.content::-webkit-scrollbar-thumb:hover { background: var(--line-2); }

/* ─── Roster (dashboard) ─────────────────────────────────────── */
.roster {
  padding: 26px 32px 60px;
  max-width: 1600px;
}
.roster-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: 28px;
}
.roster-title { font-size: 36px; font-family: 'Archivo Black', sans-serif; line-height: 1; letter-spacing: -0.01em; }
.roster-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }

.roster-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 4px;
}
.stat-label { font-size: 10px; color: var(--ink-3); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; }
.stat-value { font-family: 'Archivo Black', sans-serif; font-size: 32px; line-height: 1; letter-spacing: -0.02em; }
.stat-trend { font-size: 11px; color: var(--ink-2); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
.stat-trend[data-tone="good"] { color: var(--good); }
.stat-trend[data-tone="bad"] { color: var(--bad); }

.roster-section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin: 8px 0 12px;
}
.roster-section-title { font-size: 12.5px; font-weight: 600; }
.roster-section-meta { font-size: 11px; color: var(--ink-3); }

.client-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}

.client-card {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px;
  cursor: pointer;
  transition: border-color .14s, transform .14s;
  position: relative;
  overflow: hidden;
}
.client-card:hover { border-color: var(--line-2); transform: translateY(-1px); }
.client-card-accent {
  position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--accent);
}
.client-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.client-card-avatar {
  width: 36px; height: 36px; border-radius: 6px;
  background: var(--bg-3);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Archivo Black', sans-serif; font-size: 13px;
  letter-spacing: -0.02em;
}
.client-card-name { font-weight: 600; font-size: 14px; }
.client-card-goal { font-size: 11px; color: var(--ink-3); margin-top: 1px; }

.client-card-block {
  font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-2); font-weight: 600;
  padding: 4px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  margin-bottom: 10px;
  display: flex; justify-content: space-between;
}
.client-card-week { color: var(--ink-3); font-family: 'JetBrains Mono', monospace; }

.client-card-stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.cc-stat-label { font-size: 9px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; margin-bottom: 2px; }
.cc-stat-value { font-family: 'Archivo Black', sans-serif; font-size: 18px; line-height: 1; letter-spacing: -0.01em; }
.cc-stat-unit { font-size: 9.5px; color: var(--ink-3); margin-left: 2px; font-family: inherit; font-weight: 400; letter-spacing: 0; }

.adherence-bar {
  height: 4px; background: var(--bg-3); border-radius: 2px; overflow: hidden;
  margin-top: 4px;
}
.adherence-fill { height: 100%; background: var(--accent); border-radius: 2px; }

.client-card-footer {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 10.5px; color: var(--ink-3);
  padding-top: 10px;
  border-top: 1px solid var(--line);
}
.shared-dots { display: flex; }
.shared-dots .sb-coach-avatar { width: 18px; height: 18px; font-size: 8px; margin-left: -4px; border: 2px solid var(--bg-1); }
.shared-dots .sb-coach-avatar:first-child { margin-left: 0; }

/* ─── Sheet view ─────────────────────────────────────────────── */
.sheet-wrap {
  display: grid;
  grid-template-columns: 1fr 320px;
  height: 100%;
  overflow: hidden;
}
.sheet-main {
  overflow-y: auto;
  padding: 22px 28px 60px;
}
.sheet-side {
  border-left: 1px solid var(--line);
  background: var(--bg-1);
  overflow-y: auto;
  padding: 22px 20px 40px;
}

.client-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
  gap: 18px;
}
.ch-id { display: flex; align-items: center; gap: 14px; }
.ch-avatar {
  width: 52px; height: 52px; border-radius: 8px;
  background: var(--bg-3);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Archivo Black', sans-serif; font-size: 18px;
  letter-spacing: -0.02em;
}
.ch-name { font-family: 'Archivo Black', sans-serif; font-size: 24px; line-height: 1; letter-spacing: -0.01em; text-transform: uppercase; }
.ch-goal { font-size: 12px; color: var(--ink-3); margin-top: 5px; }

.ch-meta { display: flex; align-items: center; gap: 18px; }
.ch-meta-block {
  display: flex; flex-direction: column; gap: 2px;
  border-left: 1px solid var(--line);
  padding-left: 14px;
}
.ch-meta-label { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.ch-meta-value { font-family: 'Archivo Black', sans-serif; font-size: 16px; line-height: 1; letter-spacing: -0.01em; }
.ch-meta-value small { font-family: inherit; font-weight: 400; font-size: 11px; color: var(--ink-3); letter-spacing: 0; }

/* mesocycle bar */
.meso {
  display: flex; align-items: stretch; gap: 4px;
  margin-bottom: 22px;
  padding: 12px 14px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 6px;
}
.meso-label {
  font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 600;
  display: flex; align-items: center;
  margin-right: 14px;
  padding-right: 14px;
  border-right: 1px solid var(--line);
}
.meso-cells { display: flex; gap: 3px; flex: 1; }
.meso-cell {
  flex: 1; height: 22px; border-radius: 3px;
  background: var(--bg-3);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-family: 'JetBrains Mono', monospace;
  color: var(--ink-3);
  cursor: pointer;
  border: 1px solid transparent;
}
.meso-cell:hover { border-color: var(--line-2); }
.meso-cell[data-state="done"] { background: var(--bg-2); color: var(--ink-2); }
.meso-cell[data-state="current"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.meso-cell[data-state="upcoming"] { background: var(--bg-3); }
.meso-cell[data-state="deload"] { background: var(--bg-2); color: var(--accent); border-color: var(--accent); }

/* day tabs */
.day-tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--line);
  margin-bottom: 0;
}
.day-tab {
  padding: 12px 16px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink-3);
  cursor: pointer;
  border: 0; background: transparent;
  font-family: inherit;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
}
.day-tab:hover { color: var(--ink-2); }
.day-tab[data-active="true"] {
  color: var(--ink);
  border-bottom-color: var(--accent);
}
.day-tab-day { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-4); font-weight: 600; }
.day-tab[data-active="true"] .day-tab-day { color: var(--accent); }
.day-tab-status {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--bg-3);
  display: inline-block; margin-left: 6px;
}
.day-tab-status[data-status="logged"] { background: var(--good); }
.day-tab-status[data-status="in_progress"] { background: var(--warn); }

/* ─── Sheet table ────────────────────────────────────────────── */
.sheet {
  border: 1px solid var(--line);
  border-top: 0;
  border-radius: 0 0 6px 6px;
  overflow: hidden;
  background: var(--bg-1);
}

.sheet-row-header {
  display: grid;
  grid-template-columns: 28px 1fr 70px 110px 80px repeat(var(--set-count, 4), 1fr) 90px 28px;
  align-items: center;
  background: var(--bg-2);
  border-bottom: 1px solid var(--line);
  padding: 0;
  font-size: 9.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 600;
  height: 30px;
}
.sheet-row-header > div { padding: 0 8px; border-right: 1px solid var(--line); height: 100%; display: flex; align-items: center; }
.sheet-row-header > div:last-child { border-right: 0; }
.sheet-row-header .sh-set { justify-content: center; padding: 0; font-family: 'JetBrains Mono', monospace; }

.exercise-row {
  display: grid;
  grid-template-columns: 28px 1fr 70px 110px 80px repeat(var(--set-count, 4), 1fr) 90px 28px;
  align-items: stretch;
  border-bottom: 1px solid var(--line);
  background: var(--bg-1);
  min-height: 56px;
  position: relative;
}
.exercise-row:last-child { border-bottom: 0; }
.exercise-row:hover { background: var(--bg-2); }
.exercise-row > div { padding: 8px; border-right: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center; }
.exercise-row > div:last-child { border-right: 0; }

.row-handle {
  color: var(--ink-4); font-size: 14px; cursor: grab; user-select: none;
  align-items: center !important; justify-content: center;
  padding: 0 !important;
}
.exercise-name { font-weight: 600; font-size: 13px; }
.exercise-pattern {
  font-size: 9.5px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase;
  margin-top: 2px;
  display: flex; gap: 6px;
}
.exercise-pattern span:not(:first-child)::before { content: "·"; margin-right: 6px; color: var(--ink-4); }

.target-cell { text-align: center; align-items: center !important; }
.target-reps { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--ink); font-weight: 600; }
.target-label { font-size: 9px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; }

.last-cell { align-items: center !important; }
.last-weight { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
.last-meta { font-size: 9.5px; color: var(--ink-3); margin-top: 1px; }

.suggestion-cell {
  align-items: center !important;
  background: rgba(232,255,58,0.06);
}
.suggestion-weight { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--accent); font-weight: 700; }
.suggestion-label { font-size: 9px; color: var(--accent); opacity: 0.75; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }

/* set cell */
.set-cell {
  align-items: stretch !important;
  justify-content: stretch !important;
  padding: 0 !important;
  position: relative;
}
.set-cell-inner {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 1px;
  height: 100%; width: 100%;
  padding: 4px 6px;
  cursor: pointer;
  position: relative;
}
.set-cell[data-done="true"] .set-cell-inner { background: rgba(58,224,122,0.06); }
.set-input {
  background: transparent; border: 0; color: var(--ink);
  font-family: 'JetBrains Mono', monospace;
  text-align: center; font-size: 13px; font-weight: 600;
  width: 100%; padding: 0; outline: none;
  -moz-appearance: textfield;
}
.set-input::-webkit-inner-spin-button, .set-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.set-input:focus { color: var(--accent); }
.set-cell[data-done="true"] .set-input { color: var(--good); }
.set-meta-row {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 9.5px; color: var(--ink-3);
  font-family: 'JetBrains Mono', monospace;
}
.set-meta-rpe { color: var(--ink-2); }
.set-checkbox {
  position: absolute; top: 4px; right: 4px;
  width: 12px; height: 12px;
  border-radius: 2px; border: 1px solid var(--line-2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-1);
}
.set-cell[data-done="true"] .set-checkbox { background: var(--good); border-color: var(--good); color: var(--accent-ink); }

.actions-cell { align-items: center !important; justify-content: center; }
.action-btn {
  appearance: none; border: 0; background: transparent;
  color: var(--ink-3); padding: 4px; font-family: inherit;
  font-size: 11px; cursor: pointer; line-height: 1;
}
.action-btn:hover { color: var(--ink); }

.row-note {
  background: var(--bg-2);
  border-bottom: 1px solid var(--line);
  padding: 8px 16px 8px 38px;
  font-size: 11.5px;
  color: var(--ink-2);
  display: flex; gap: 8px; align-items: flex-start;
}
.row-note-label {
  font-size: 9px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase;
  font-weight: 700; padding-top: 1px; flex-shrink: 0;
}

.add-exercise-row {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 16px;
  background: var(--bg-1);
  border-top: 1px solid var(--line);
}
.add-exercise-btn {
  appearance: none; border: 1px dashed var(--line-2);
  background: transparent;
  color: var(--ink-3);
  padding: 8px 14px;
  border-radius: 4px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.add-exercise-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ─── Right rail (dashboard widgets + notes) ─────────────────── */
.rail-section { margin-bottom: 28px; }
.rail-title {
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 700;
  margin-bottom: 10px;
  display: flex; justify-content: space-between; align-items: center;
}
.rail-card {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px 14px;
  margin-bottom: 8px;
}
.rail-stat-row { display: flex; justify-content: space-between; align-items: baseline; }
.rail-stat-label { font-size: 11px; color: var(--ink-3); }
.rail-stat-value { font-family: 'Archivo Black', sans-serif; font-size: 22px; line-height: 1; letter-spacing: -0.01em; }
.rail-stat-value small { font-size: 11px; color: var(--ink-3); margin-left: 3px; font-family: inherit; font-weight: 400; }

.note-item {
  padding: 10px 12px;
  border-left: 2px solid var(--accent);
  background: var(--bg-2);
  border-radius: 0 4px 4px 0;
  margin-bottom: 6px;
  font-size: 12px;
  line-height: 1.5;
}
.note-item-meta { display: flex; justify-content: space-between; font-size: 9.5px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }

.note-input {
  width: 100%;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 9px 11px;
  color: var(--ink);
  font-family: inherit;
  font-size: 12px;
  resize: none;
  outline: none;
}
.note-input:focus { border-color: var(--line-2); }

/* Volume bars */
.vol-bar-row {
  display: grid;
  grid-template-columns: 60px 1fr 36px;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  font-size: 11px;
}
.vol-bar-label { color: var(--ink-2); font-weight: 500; }
.vol-bar-track { height: 8px; background: var(--bg-3); border-radius: 2px; overflow: hidden; }
.vol-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; }
.vol-bar-val { font-family: 'JetBrains Mono', monospace; color: var(--ink-3); text-align: right; font-size: 10.5px; }

/* ─── Library view ───────────────────────────────────────────── */
.lib {
  padding: 26px 32px 60px;
  max-width: 1400px;
}
.lib-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 22px; }
.lib-title { font-family: 'Archivo Black', sans-serif; font-size: 36px; line-height: 1; letter-spacing: -0.01em; }
.lib-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }

.lib-filters {
  display: flex; gap: 24px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 14px 18px;
  margin-bottom: 18px;
  align-items: flex-start;
  flex-wrap: wrap;
}
.lib-filter-group { display: flex; flex-direction: column; gap: 6px; min-width: 180px; }
.lib-filter-label { font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
.lib-chips { display: flex; gap: 4px; flex-wrap: wrap; }
.lib-chip {
  appearance: none; border: 1px solid var(--line-2);
  background: transparent; color: var(--ink-2);
  font-family: inherit; font-size: 11px; font-weight: 500;
  padding: 4px 9px; border-radius: 3px;
  cursor: pointer;
  text-transform: capitalize;
}
.lib-chip:hover { border-color: var(--ink-3); color: var(--ink); }
.lib-chip[data-active="true"] {

}

.lib-search {
  flex: 1; min-width: 240px;

}
.lib-search-input {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 8px 10px;
  color: var(--ink); font-family: inherit; font-size: 12.5px;

.lib-search-input:focus { border-color: var(--line-2); }

.lib-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));

.lib-result-meta {
  font-size: 11px; color: var(--ink-3);
  margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center;

.lib-card {
  background: var(--bg-1);

.lib-card-name { font-weight: 600; font-size: 13px; line-height: 1.2; }

.lib-level-dot {

  margin-right: 4px;
}
.lib-level-dot[data-level="beginner"] { background: var(--good); }
.lib-level-dot[data-level="intermediate"] { background: var(--warn); }
.lib-level-dot[data-level="advanced"] { background: var(--bad); }

/* ─── Volume sparkline ───────────────────────────────────────── */
.spark {
  height: 80px;
  width: 100%;
  display: block;
}

/* ─── Library picker overlay (when adding to sheet) ───────────── */
.picker-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  display: flex; align-items: center; justify-content: center;
  z-index: 50;
  padding: 40px;
}
.picker {
  background: var(--bg-1);
  border: 1px solid var(--line-2);
  border-radius: 8px;
  width: 720px; max-width: 100%;
  max-height: 85vh;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.picker-head {
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.picker-title { font-family: 'Archivo Black', sans-serif; font-size: 16px; letter-spacing: -0.01em; }
.picker-search {
  background: var(--bg-2); border: 1px solid var(--line);
  padding: 7px 10px; border-radius: 4px;
  color: var(--ink); font-family: inherit; font-size: 12px;
  outline: none;
  width: 100%;
}
.picker-filters {
  display: flex; flex-wrap: wrap; gap: 4px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--line);
}
.picker-list { flex: 1; overflow-y: auto; padding: 8px; }
.picker-item {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 12px;
  padding: 9px 12px;
  border-radius: 4px;
  cursor: pointer;
  align-items: center;
}
.picker-item:hover { background: var(--bg-2); }
.picker-item-name { font-size: 13px; font-weight: 500; }
.picker-item-meta { font-size: 10.5px; color: var(--ink-3); }

</style>
</head>

<script type="text/babel">

// ── Settings panel helpers ───────────────────────────────────────────────────

const __TWEAKS_STYLE = `

// ── useTweaks ───────────────────────────────────────────────────────────────
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
function TweaksPanel({ title = 'Settings', open, onClose, children }) {
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  const dismiss = onClose;

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

// Small line-chart sparkline
const Sparkline = ({ data, color = 'currentColor', fill = true, h = 80 }) => {
  if (!data || data.length === 0) return null;
  const w = 100;
  const max = Math.max(...data) * 1.05;
  const min = Math.min(...data) * 0.95;
  const range = (max - min) || 1;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - 8) - 4;
    return [x, y];
  });
  const path = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const area = path + ` L${w},${h} L0,${h} Z`;
  return (
    <svg className="spark" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      {fill && (
        <>
          <defs>
            <linearGradient id="sparkfill" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stopColor={color} stopOpacity="0.32"/>
              <stop offset="100%" stopColor={color} stopOpacity="0"/>
            </linearGradient>
          </defs>
          <path d={area} fill="url(#sparkfill)"/>
        </>
      )}
      <path d={path} fill="none" stroke={color} strokeWidth="1.5" vectorEffect="non-scaling-stroke"/>
      {pts.map((p, i) => (
        <circle key={i} cx={p[0]} cy={p[1]} r="1.4" fill={color} />
      ))}
    </svg>
  );
};

const SET_COLS = 4; // visible set columns

function MesoBar({ week, totalWeeks }) {
  const cells = Array.from({ length: totalWeeks }, (_, i) => {
    const w = i + 1;
    const isDeload = w === totalWeeks;
    if (w < week) return { w, state: 'done' };
    if (w === week) return { w, state: 'current' };
    if (isDeload) return { w, state: 'deload' };
    return { w, state: 'upcoming' };
  });
  return (
    <div className="meso">
      <div className="meso-label">Mesocycle · 8wk</div>
      <div className="meso-cells">
        {cells.map(c => (
          <div key={c.w} className="meso-cell" data-state={c.state}>W{c.w}{c.state === 'deload' ? '·DL' : ''}</div>
        ))}
      </div>
    </div>
  );
}

function SetCell({ set, onChange, onToggle, exerciseId, idx }) {
  return (
    <div className="set-cell" data-done={set.done}>
      <div className="set-cell-inner">

               onChange={(e) => onChange({ weight: Number(e.target.value) })}/>

          {set.rpe != null && <span className="set-meta-rpe">@{set.rpe}</span>}

      </div>
    </div>
  );
}

function ExerciseRow({ ex, onUpdate, onRemove, onOpenNote, onPickAlt }) {
  const meta = window.EXERCISE_BY_ID[ex.id];
  if (!meta) return null;
  const pad = Array.from({ length: Math.max(0, SET_COLS - ex.sets.length) });
  const lastSet = ex.sets[ex.sets.length - 1];
  const completedSets = ex.sets.filter(s => s.done).length;

  return (
    <>
      <div className="exercise-row">
        <div className="row-handle"><Icon name="drag" size={14}/></div>
        <div>
          <div className="exercise-name">{meta.name}</div>
          <div className="exercise-pattern">
            <span>{window.PATTERN_LABEL[meta.pattern]}</span>
            <span>{meta.equipment}</span>
            <span>{meta.muscles.slice(0, 2).join('/')}</span>
          </div>
        </div>
        <div className="target-cell">
          <div className="target-reps">{ex.sets.length}×{ex.targetReps}</div>
          <div className="target-label">target</div>
        </div>
        <div className="last-cell">
          <div className="last-weight">{ex.last} <span style={{ color: 'var(--ink-3)' }}>lb</span></div>
          <div className="last-meta">last · {completedSets}/{ex.sets.length} done</div>
        </div>
        <div className="suggestion-cell">
          <div className="suggestion-weight">{ex.suggestion}</div>
          <div className="suggestion-label">suggest</div>
        </div>
        {ex.sets.map((s, i) => (
          <SetCell key={i} set={s} idx={i} exerciseId={ex.id}
                   onChange={(patch) => {
                     const sets = ex.sets.map((ss, j) => j === i ? { ...ss, ...patch } : ss);
                     onUpdate({ ...ex, sets });
                   }}
                   onToggle={() => {
                     const sets = ex.sets.map((ss, j) => j === i ? { ...ss, done: !ss.done } : ss);
                     onUpdate({ ...ex, sets });
                   }}/>
        ))}
        {pad.map((_, i) => <div key={'pad'+i} style={{ background: 'var(--bg-2)', opacity: 0.4 }}/>)}
        <div style={{ alignItems: 'center', justifyContent: 'center', display: 'flex', gap: 4 }}>
          <button className="action-btn" title="Add note" onClick={onOpenNote}><Icon name="note" size={12}/></button>
          <button className="action-btn" title="Swap exercise" onClick={onPickAlt}>↻</button>
          <button className="action-btn" title="Remove" onClick={onRemove}>✕</button>
        </div>
        <div className="row-handle">⋮</div>
      </div>
      {ex.note && (
        <div className="row-note">
          <span className="row-note-label">Note</span>
          <span>{ex.note}</span>
        </div>
      )}
    </>
  );
}

function Sheet({ client, showNotesCol }) {
  // Find the program — for now, MARCUS_PROGRAM is canonical; for other clients, generate a slim version.
  const baseProgram = client.id === 'mar'
    ? window.MARCUS_PROGRAM
    : makeFallbackProgram(client);

  const [program, setProgram] = React.useState(baseProgram);
  React.useEffect(() => {
    setProgram(client.id === 'mar' ? window.MARCUS_PROGRAM : makeFallbackProgram(client));
  }, [client.id]);

  const [activeDayIdx, setActiveDayIdx] = React.useState(
    program.days.findIndex(d => d.status === 'in_progress') >= 0
      ? program.days.findIndex(d => d.status === 'in_progress')
      : 0
  );
  const [pickerOpen, setPickerOpen] = React.useState(false);
  const [noteOpenForIdx, setNoteOpenForIdx] = React.useState(null);

  const day = program.days[activeDayIdx];

  const updateDay = (newDay) => {
    const days = program.days.map((d, i) => i === activeDayIdx ? newDay : d);
    setProgram({ ...program, days });
  };

  const updateExercise = (idx, newEx) => {
    const exercises = day.exercises.map((e, i) => i === idx ? newEx : e);
    updateDay({ ...day, exercises });
  };

  const removeExercise = (idx) => {
    updateDay({ ...day, exercises: day.exercises.filter((_, i) => i !== idx) });
  };

  const addExercise = (meta) => {
    const newEx = {
      id: meta.id,
      sets: Array.from({ length: 3 }, () => ({ reps: 8, weight: 0, rpe: null, done: false })),
      targetReps: 8, suggestion: 0, last: 0,
    };
    updateDay({ ...day, exercises: [...day.exercises, newEx] });
    setPickerOpen(false);
  };

  // Total volume done today
  const todayVolume = day.exercises.reduce((sum, e) =>
    sum + e.sets.filter(s => s.done).reduce((a, s) => a + s.weight * s.reps, 0), 0);

            <div className="rail-stat-row" style={{ marginBottom: 4 }}>

              <span className="rail-stat-value">41.9<small>k lb</small></span>
            </div>
            <Sparkline data={volumeData.map(v => v.volume)} color="var(--accent)" h={70}/>
          </div>
        </div>
      )}

      {volByMuscle && (
        <div className="rail-section">
          <div className="rail-title"><span>Volume by Muscle</span><span>weekly · sets</span></div>
          <div className="rail-card">
            {volByMuscle.map(v => (
              <div className="vol-bar-row" key={v.group}>
                <div className="vol-bar-label">{v.group}</div>
                <div className="vol-bar-track">
                  <div className="vol-bar-fill" style={{ width: ((v.volume / maxMuscleVol) * 100) + '%' }}/>
                </div>
                <div className="vol-bar-val">{v.sets}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {oneRMHistory && (
        <div className="rail-section">
          <div className="rail-title"><span>e1RM Trends · 12wk</span></div>
          <div className="rail-card">
            {Object.entries(oneRMHistory).map(([id, hist]) => {
              const ex = window.EXERCISE_BY_ID[id];
              const last = hist[hist.length-1];
              const first = hist[0];
              const delta = last - first;
              return (
                <div key={id} style={{ marginBottom: 10 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11.5, marginBottom: 2 }}>
                    <span style={{ fontWeight: 600 }}>{ex.name}</span>
                    <span className="font-mono">
                      {last}lb <span style={{ color: 'var(--good)', marginLeft: 4 }}>+{delta}</span>
                    </span>
                  </div>
                  <Sparkline data={hist} color={client.accent} h={28}/>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {showNotesCol && (
        <div className="rail-section">
          <div className="rail-title">
            <span>Coach Notes</span>
            <span style={{ color: 'var(--ink-3)' }}>{notes.length}</span>
          </div>
          <div style={{ marginBottom: 10 }}>
            <textarea className="note-input" rows={2}
                      value={noteText} onChange={(e) => setNoteText(e.target.value)}
                      placeholder="Add a note (visible to all coaches sharing this client)…"/>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 6 }}>
              <span style={{ fontSize: 10, color: 'var(--ink-3)' }}>Synced to cloud · visible to KH, DR</span>
              <button className="btn btn-sm" onClick={submitNote}>Post</button>
            </div>
          </div>
          {notes.map((n, i) => (
            <div key={i} className="note-item">
              <div className="note-item-meta">
                <span>{n.author}</span>
                <span>{n.date}</span>
              </div>
              {n.text}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ExercisePicker({ onPick, onClose }) {
  const [search, setSearch] = React.useState('');
  const [pattern, setPattern] = React.useState('all');
  const filtered = window.EXERCISES.filter(e => {
    if (pattern !== 'all' && e.pattern !== pattern) return false;
    if (search && !e.name.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });
  return (
    <div className="picker-overlay" onClick={onClose}>
      <div className="picker" onClick={(e) => e.stopPropagation()}>
        <div className="picker-head">
          <div className="picker-title">Pick Exercise</div>
          <button className="action-btn" onClick={onClose} style={{ fontSize: 16, color: 'var(--ink-2)' }}>✕</button>
        </div>
        <div style={{ padding: '12px 18px' }}>
          <input className="picker-search" autoFocus
                 value={search} onChange={(e) => setSearch(e.target.value)}
                 placeholder="Search 150+ exercises…"/>
        </div>
        <div className="picker-filters">
          <button className="lib-chip" data-active={pattern === 'all'} onClick={() => setPattern('all')}>All</button>
          {window.PATTERNS.map(p => (
            <button key={p} className="lib-chip" data-active={pattern === p} onClick={() => setPattern(p)}>{p}</button>
          ))}
        </div>
        <div className="picker-list">
          {filtered.slice(0, 60).map(e => (
            <div key={e.id} className="picker-item" onClick={() => onPick(e)}>
              <div>
                <div className="picker-item-name">{e.name}</div>
                <div className="picker-item-meta">{e.muscles.join(' · ')}</div>
              </div>
              <span className="lib-mini-tag">{e.equipment}</span>
              <span className="lib-mini-tag">
                <span className="lib-level-dot" data-level={e.level}/>{e.level}
              </span>
            </div>
          ))}
          {filtered.length === 0 && <div style={{ padding: 30, color: 'var(--ink-3)', textAlign: 'center' }}>No matches.</div>}
        </div>
      </div>
    </div>
  );
}

<script type="text/babel">
function App() {
  const { TweaksPanel, TweakSection, TweakRadio, TweakColor, TweakToggle, TweakSelect } = window;
  const { Sidebar, Topbar, Roster, Sheet, Library } = window;
  const [view, setView] = React.useState('roster');
  const [clientId, setClientId] = React.useState('mar');
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const [theme, setTheme] = React.useState('dark');
  const [accent, setAccent] = React.useState('#E8FF3A');
  const [showNotes, setShowNotes] = React.useState(true);

  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.style.setProperty('--accent', accent);
  }, [theme, accent]);

  const currentClient = window.CLIENTS.find(c => c.id === clientId) || window.CLIENTS[0];

  return (
    <div className="app">
      <Sidebar view={view} setView={setView}
               currentClientId={clientId} setClientId={setClientId}/>
      <div className="main">
        <Topbar view={view} currentClient={currentClient}
                onSettingsToggle={() => setSettingsOpen(v => !v)}/>
        <div className="content">
          {view === 'roster'  && <Roster setView={setView} setClientId={setClientId}/>}
          {view === 'sheet'   && <Sheet client={currentClient} showNotesCol={showNotes}/>}
          {view === 'library' && <Library/>}
        </div>
      </div>

      <TweaksPanel title="Settings" open={settingsOpen} onClose={() => setSettingsOpen(false)}>
        <TweakSection label="Theme"/>
        <TweakRadio label="Mode" value={theme} options={['dark','light']}
                    onChange={setTheme}/>
        <TweakColor label="Accent" value={accent}
                    onChange={setAccent}/>
        <TweakSection label="Sheet"/>
        <TweakToggle label="Show notes column" value={showNotes}
                     onChange={setShowNotes}/>
        <TweakSection label="Active client"/>
        <TweakSelect label="View as"
                     value={clientId}
                     options={window.CLIENTS.map(c => ({ value: c.id, label: c.name }))}
                     onChange={setClientId}/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
